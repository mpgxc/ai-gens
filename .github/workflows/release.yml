name: Build Cadence (macOS)

# Deliberately NOT on push-to-main: the app is built on a macOS runner, which
# is slow and only meaningful when you actually want a build. Tagging cuts a
# release; workflow_dispatch gives you a compile check without one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-26 is Apple silicon and ships Xcode 26.x by default, which is what
    # Liquid Glass (glassEffect, GlassEffectContainer) requires. An older image
    # cannot build this target at all — it has no macOS 26 SDK.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "SDKs:"; xcodebuild -showsdks | grep -i macos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: cadence/macos
        run: xcodegen generate

      # Ad-hoc signed ("-"), not unsigned. Signing properly needs a Developer ID
      # certificate in secrets and this repo has none, but building with
      # CODE_SIGNING_ALLOWED=NO leaves the bundle with no signature at all, and
      # Gatekeeper reports that as *"Cadence is damaged and can't be opened"* —
      # which reads like a corrupt download and offers only "Move to Trash".
      # An ad-hoc signature produces a structurally valid (if untrusted) bundle,
      # so the block degrades to the ordinary unidentified-developer path that
      # "Open Anyway" can get past.
      #
      # Either way the download still carries the quarantine flag, so the
      # release notes lead with `xattr -dr com.apple.quarantine`, which is the
      # one step that always works.
      - name: Build
        working-directory: cadence/macos
        run: |
          set -o pipefail
          xcodebuild \
            -project Cadence.xcodeproj \
            -scheme Cadence \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Verify the signature
        run: |
          set -euo pipefail
          APP="cadence/macos/build/Build/Products/Release/Cadence.app"
          codesign --verify --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E 'Signature|Identifier|TeamIdentifier' || true

      - name: Package .dmg
        id: package
        run: |
          set -euo pipefail
          APP="cadence/macos/build/Build/Products/Release/Cadence.app"
          test -d "$APP" || { echo "::error::no .app at $APP"; exit 1; }

          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p stage dist
          cp -R "$APP" stage/
          ln -s /Applications stage/Applications      # drag-to-install target
          hdiutil create \
            -volname "Cadence" \
            -srcfolder stage \
            -ov -format UDZO \
            "dist/Cadence-${VERSION}.dmg"

          # Second copy under a fixed name. GitHub serves
          #   /releases/latest/download/<asset-name>
          # by exact filename, so a versioned name would make the landing
          # page's download link 404 on every new release. The versioned copy
          # stays for anyone browsing the releases list.
          cp "dist/Cadence-${VERSION}.dmg" "dist/Cadence.dmg"
          ls -lh dist

      # Always available, even for a dispatch run with no tag to attach to.
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-${{ steps.package.outputs.version }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

      # Creates the release when the tag doesn't have one yet, so cutting a
      # release is exactly `git tag vX.Y.Z && git push origin vX.Y.Z` and
      # nothing else. Uploading to a release that does not exist would fail,
      # and there is no way to pre-create one from a tag push.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg \
              --title "Cadence $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md
          fi
